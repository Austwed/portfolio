`<div class="group"><strong>备战</strong><p>选择最多 3 名队长、12 名士兵；建议按钮按关卡推荐编队，数字颜色提示建议品质。出战需要体力和军需。</p></div><div class="group"><strong>部署与指挥</strong><p>先放队长，再放所属士兵；可拖划连续放置，或一键部署。战斗中选择队长，点击空地或敌人可下达移动、攻击命令。</p></div><div class="group"><strong>队伍策略</strong><p>士兵可跟随队长或自动寻敌；战斗支持暂停和调整速度，也可在部署区补充预备队。</p></div><div class="group"><strong>战果</strong><p>胜利后领取奖励，可招募倒地敌人；己方士兵可能阵亡或受伤。失败可调整队伍重试，但会消耗体力。</p></div>`,
`<div class="group"><strong>兵种选择</strong><p>剑士擅长近战承伤；弓兵射程远；法师射程较短，面对高防目标有优势。队长各有作用于小队的被动。</p></div><div class="group"><strong>品质与合成</strong><p>粮田达到 3 级可提升队长品质，5 级解锁士兵合成。5 名同兵种、同品质士兵合成 1 名更高品质士兵，人数会减少。</p></div><div class="group"><strong>游玩建议</strong><p>先关注粮草收支和剩余军需，逐步升级粮田；挑战受阻可休息、招募或调整兵种，也可出售多余粮草筹钱。</p></div><div class="group"><strong>战斗前</strong><p>士兵和队长生命不足 30% 时无法主动出征。按建议配兵只是参考，留意品质、兵种搭配与出征后剩余的生产人手。</p></div>`];page=Math.max(0,Math.min(titles.length-1,Number(page)||0));modal={manual:true,title:'玩法说明',body:`<div class="row">${titles.map((t,i)=>`<button data-act="manual-page:${i}" class="${i===page?'primary':''}">${t}</button>`).join('')}</div>${sections[page]}`,buttons:'<button data-act="menu">返回菜单</button><button class="primary" data-act="close-modal">关闭</button>'};render()}

function mergeModal(){let body='<p>五名同兵种、同品质士兵合成一组；可输入组数批量合成。单位生命、攻击、防御 ×2；工作产出 ×5，粮草和军需消耗 ×2。合成后人数减少，出战总兵力可能下降。继承平均生命比例和当天工作限制。</p>';for(let k=0;k<types.length;k++)for(let g=0;g<3;g++){let n=state.soldiers.filter(u=>u.kind===k&&u.grade===g).length;if(n)body+=`<div class="line"><span class="tier${g}">${cls(k)} ${types[k]} ${n} 人 → <span class="tier${g+1}">${types[k]}</span></span><input id="merge-qty-${k}-${g}" aria-label="${types[k]}合成组数" type="number" min="1" max="${Math.floor(n/mergeSize)}" step="1" value="1"><button data-act="merge-do:${k},${g}" ${n<mergeSize?'disabled':''}>合成</button></div>`}modal={title:'士兵合成',body,buttons:'<button data-act="close-modal">关闭</button>'};render()}
function merge(k,g,count=1){if(g>=3)return;let group=state.soldiers.filter(u=>u.kind===k&&u.grade===g).slice(0,mergeSize*count);if(group.length<mergeSize*count)return;let ids=new Set(group.map(u=>u.id));state.soldiers=state.soldiers.filter(u=>!ids.has(u.id));for(let j=0;j<count;j++){let batch=group.slice(j*mergeSize,(j+1)*mergeSize),hp=batch.reduce((a,u)=>a+u.hp,0)/mergeSize,day=batch.some(u=>u.day==='fought')?'fought':batch.some(u=>u.day==='observer')?'observer':'normal',u=soldier(k,g+1,hp);u.day=day;state.soldiers.push(u)}if(state.manualPicks)state.manualPicks=state.manualPicks.map(team=>team.filter(id=>!ids.has(id)));state.plan=pick().map(arr=>types.map((_,kind)=>arr.filter(unit=>unit.kind===kind).length));mergeModal()}
function trade(key,buy){let el=$('#qty-'+key),n=Number(el?.value),prices=tradePrices;if(!Number.isSafeInteger(n)||n<1){playSound('error');tell('请输入大于 0 的整数数量。');return}let [p,s]=prices[key];if(buy){if(state.gold<n*p){playSound('error');tell('金币不足。');return}state.gold-=n*p;recordFlow('gold',-n*p,'购买'+({food:'粮草',supply:'军需',material:'原料'}[key]));state[key]+=n;recordFlow(key,n,'购买')}else{if(state[key]<n){playSound('error');tell('库存不足。');return}state[key]-=n;recordFlow(key,-n,'出售');state.gold+=n*s;recordFlow('gold',n*s,'出售'+({food:'粮草',supply:'军需',material:'原料'}[key]))}state.last=(buy?'购买':'出售')+n+' '+({food:'粮草',supply:'军需',material:'原料'}[key]);render()}
function rescueCheck(){if(modal||state.soldiers.length)return;let liquid=state.gold+Math.floor(state.food)*1+Math.floor(state.supply)*2+Math.floor(state.material)*1;if(liquid<15){modal={title:'营地需要人手',body:'基地已经无人且资源不足，补充一名剑士后可以继续经营。',buttons:'<button class="primary" data-act="relief">补充剑士</button>'};render()}}
function handle(a){let [cmd,arg]=a.split(':'),b=state.battle;if(!guideGate(cmd,arg))return;if(cmd==='market-step'){marketStep=marketStep===1?10:marketStep===10?100:1;let toggle=$('[data-act="market-step"]');toggle.textContent='×'+marketStep;toggle.setAttribute('aria-label','切换数量级，当前 '+marketStep);document.querySelectorAll('[data-quantity]').forEach(el=>{let minus=el.dataset.quantity.endsWith(',-10');el.textContent=(minus?'−':'＋')+marketStep;let input=document.getElementById(el.dataset.quantity.split(',')[0]);el.setAttribute('aria-label',(input?.getAttribute('aria-label')||'数量')+(minus?'减少 ':'增加 ')+marketStep)});return}if(cmd==='prep-help'){modal={prepHelp:true,title:'备战说明',body:'<p>最多选择 3 名角色和 12 名士兵。生命低于 30% 的单位不能出战。</p><p>每名上场士兵消耗军需；当天参战的士兵不能工作。自动选兵优先选择已参战的士兵。</p><p>建议数量颜色表示推荐品质；自动选兵仍优先选已参战者，品质可手动调整。</p><p>先升级粮田和角色；休息恢复体力与生命，粮草有余可出售。兵力不足时招募或招降，五名同品质士兵可合成。</p>',buttons:'<button class="primary" data-act="close-modal">知道了</button>'};render();return}if(cmd==='screen'){screenMode=arg;fitCanvas();render();return}if(cmd==='manual'||cmd==='manual-page'){showManual(arg);return}if(cmd==='leaderboard'){showScores();return}if(cmd==='menu'){modal={menu:true,title:'菜单',body:`<div class="line"><span>画面方向</span><span class="row"><button data-act="screen:landscape">横屏</button><button data-act="screen:portrait">竖屏</button></span></div><div class="line"><label for="sound-volume">音量 <span id="sound-value">${Math.round(audioVolume*100)}%</span></label><input id="sound-volume" type="range" min="0" max="100" value="${Math.round(audioVolume*100)}"></div>`,buttons:'<button data-act="manual">说明</button><button data-act="leaderboard">排行榜</button><button data-act="restart">重新开始</button><button data-act="close-modal">关闭</button>'};render();return}if(cmd==='relief'){if(!state.soldiers.length)state.soldiers.push(soldier(0));modal=null;state.last='已补充一名剑士，可继续经营。';render();return}if(cmd==='restart'){modal={restartConfirm:true,title:'重新开始',body:'当前进度将被清空。',buttons:'<button data-act="close-modal">取消</button><button class="primary" data-act="restart-confirm">重新开始</button>'};render();return}if(cmd==='restart-confirm'){sweepCache=null;state=init();modal=null;openBuilding=null;marketReturn=null;stagePhase=0;marketStep=1;lastGuide='';fitCanvas();render();return}if(cmd==='end-prototype'){document.body.innerHTML='<main style="padding:3rem;color:#f3dfb9;text-align:center"><h2>原型已结束</h2><p>可关闭当前页面，或刷新后重新开始。</p></main>';return}if(cmd==='close-modal'){modal=null;render();rescueCheck();return}if(cmd==='open-building'){state.last='';openBuilding=arg==='ruins'?'stages':arg;render();return}if(cmd==='stage-phase'){stagePhase=Number(arg);render();return}if(cmd==='stage'){let i=Number(arg);if(stageUnlocked(i)){state.stage=i;stagePhase=Math.floor(i/3);render()}return}if(cmd==='stage-ready'||cmd==='stage-sweep-ready'){state.last='';openBuilding='ruins';render();return}if(cmd==='stage-back'){openBuilding='stages';render();return}if(cmd==='buy-supply'){marketReturn='ruins';openBuilding='market';render();return}if(cmd==='close-building'){state.last='';openBuilding=marketReturn;marketReturn=null;render();return}if(cmd==='leader-select'){let i=+arg,l=state.leaders[i];if(pickAction===i)pickAction=-1;if(!l.selected&&(l.hp<.3||state.leaders.filter(x=>x.selected).length>=3))return;if(!state.manualPicks)state.manualPicks=pick().map(a=>a.map(u=>u.id));l.selected=!l.selected;if(!l.selected){state.manualPicks[i]=[];state.plan[i]=types.map(()=>0)}render();return}if(cmd==='select-soldiers'){openSelect();return}if(cmd==='auto-pick'){applyAdvice();render();return}if(cmd==='roster'){rosterModal();return}if(cmd==='merge'){mergeModal();return}if(cmd==='merge-do'){let [k,g]=arg.split(',').map(Number),n=Number($('#merge-qty-'+k+'-'+g)?.value),max=Math.floor(state.soldiers.filter(u=>u.kind===k&&u.grade===g).length/mergeSize);if(!Number.isSafeInteger(n)||n<1||n>max){let hint=document.querySelector('.modal p');if(hint)hint.textContent='请输入 1 至 '+max+' 的合成组数。';return}merge(k,g,n);return}if(cmd==='plan'){state.manualPicks=null;let [i,k,d]=arg.split(',').map(Number),max=available().filter(u=>u.kind===k).length,other=state.plan.reduce((n,row,j)=>n+(j!==i&&state.leaders[j].selected?row[k]:0),0);let totalOther=state.plan.reduce((sum,row,j)=>sum+(state.leaders[j].selected?row.reduce((a,v,kind)=>a+(j===i&&kind===k?0:v),0):0),0);state.plan[i][k]=clamp(state.plan[i][k]+d,0,Math.max(0,Math.min(max-other,squadLimit-totalOther)));render();return}if(cmd==='ration'){let[i,n]=arg.split(',').map(Number);state.ration[i]=n;render();return}if(cmd==='upgrade'){let cost=upgradeCost(arg),needsPermit=arg==='farm'&&state.farm>=4&&state.farm<=6;if(state.gold>=cost&&(!needsPermit||state.permits>0)){if(needsPermit)state.permits--;state.gold-=cost;recordFlow('gold',-cost,'设施升级');state[arg]++;state.last=(arg==='farm'?'粮田':'工坊')+' 已升至 '+state[arg]+' 级。';render()}return}if(cmd==='leader-up'){let i=+arg,cost=leaderCost(i);if(state.leaders[i].grade<3&&state.gold>=cost){state.gold-=cost;recordFlow('gold',-cost,'队长升级');state.leaders[i].grade++;state.last=state.leaders[i].name+' 已完成品质提升。';render()}return}if(cmd==='hire'){let n=Number(hireInput(+arg)?.value),cost=n*recruitPrices[+arg];if(!Number.isSafeInteger(n)||n<1||n>1000){playSound('error');tell('请输入 1 至 1000 的整数人数。');return}if(state.gold<cost){playSound('error');tell('金币不足，无法招募 '+n+' 人。');return}let guideBefore=state.guide;state.gold-=cost;recordFlow('gold',-cost,'招募士兵');for(let j=0;j<n;j++)state.soldiers.push(soldier(+arg));state.last='';if(['sword','bow','mage_buy'].includes(guideBefore))state.guideHires[+arg]+=n;if(['sword','bow','mage_buy'].includes(guideBefore)&&tutorialRemaining()===0)state.guide={sword:'bow',bow:'leave_market',mage_buy:'mage_close'}[guideBefore];render();return}if(cmd==='buy'||cmd==='sell'){trade(arg,cmd==='buy');return}if(cmd==='rest'){report();return}if(cmd==='prepare'){prepare();return}if(cmd==='sweep'){sweepPreview();return}if(cmd==='sweep-confirm'){if(!sweepCache)return;let result=sweepCache.result,outcome=sweepCache.outcome;sweepCache=null;state=result;openBuilding=null;if(state.guide==='sweep_confirm')state.guide=outcome.title==='战斗胜利'?'mage_open':'sweep_action';if(outcome.title==='战斗胜利')claim();else{modal=outcome;handle('defeat')}return}if(cmd==='card'){b.card=b.started&&b.card===arg?null:arg;b.message=b.card?'点击或拖过部署区放置；再次点击卡片退出部署。':'选择队长后点击地面移动或点击敌人攻击。';render();return}if(cmd==='auto-deploy'){autoDeploy();return}if(cmd==='clear-deploy'){b.units=b.units.filter(u=>u.side==='enemy');b.card='L'+state.leaders.findIndex(l=>l.selected&&l.hp>=.3);b.selected=null;render();return}if(cmd==='start-battle'){startBattle();return}if(cmd==='pause'){b.paused=!b.paused;render();return}if(cmd==='speed'){b.speed=+arg;render();return}if(cmd==='expand-battle'){b.expanded=!b.expanded;fitCanvas();render();return}if(cmd==='troop-mode'){let l=state.leaders[+arg];l.troopMode=l.troopMode==='follow'?'free':'follow';render();return}if(cmd==='resume-reserves'){modal=null;b.card=null;render();return}if(cmd==='defeat'){let sweepFailed=b.snapshot.guide==='sweep_confirm',begun=b.started,remainingStamina=state.stamina,attempted=state.attempted;state=clone(b.snapshot);if(begun){state.stamina=remainingStamina;state.attempted=attempted;}state.view='base';state.battle=null;fitCanvas();openBuilding='ruins';if(sweepFailed){state.guide='sweep_recover';openBuilding=null}if(state.guide!=='done'&&b.stage===0&&!state.cleared.includes(0)){state.guide='first_prepare';state.stamina=b.snapshot.stamina;}state.last=begun?'已恢复战前状态，可以调整阵容再试。':'已返回备战，可以调整阵容和军需。';modal=null;render();return}if(cmd==='claim'){claim();return}}
let selectKind='all',selectSort='hp-low',pickAction=-1,paint=null,suppressPickClick=false,selectPicks=[];
function openSelect(){selectPicks=state.manualPicks||pick().map(a=>a.map(u=>u.id));selectModal()}
function ownerOf(id){return selectPicks.findIndex(a=>a.includes(id))}
function selectModal(){let all=state.soldiers.filter(u=>selectKind==='all'||u.kind===Number(selectKind)),j=jobs();all.sort((a,b)=>selectSort==='hp-low'?a.hp-b.hp||a.id-b.id:selectSort==='hp-high'?b.hp-a.hp||a.id-b.id:selectSort==='grade-high'?b.grade-a.grade||b.hp-a.hp||a.id-b.id:a.grade-b.grade||b.hp-a.hp||a.id-b.id);modal={title:'选择出战士兵',body:`<div class="row select-controls"><label>兵种 <select id="select-kind"><option value="all">全部</option>${types.map((t,k)=>`<option value="${k}">${t}</option>`).join('')}</select></label><label>排序 <select id="select-sort"><option value="hp-low">生命从低到高</option><option value="hp-high">生命从高到低</option><option value="grade-high">品质从高到低</option><option value="grade-low">品质从低到高</option></select></label><span id="pick-count">${pickCounts()}</span></div><div class="row select-actions"><b>分配到：</b>${state.leaders.map((l,i)=>l.selected?`<button data-pick-action="${i}" class="${pickAction===i?'primary':''}"><span class="tier${l.grade}">${l.name}</span></button>`:'').join('')}<button data-pick-action="-1" class="${pickAction===-1?'primary':''}">空闲</button></div><p class="help">选择目标后点击或滑过右侧按钮；其他区域可滚动列表。图标显示基地当前工作状态。</p><div class="pick-list">${all.map(u=>{let owner=ownerOf(u.id);return `<div class="pick-row ${owner>=0?'chosen':''}" data-pick-row="${u.id}"><b class="tier${u.grade} unit-name">${cls(u.kind)} ${u.name}</b><span>${Math.ceil(u.hp*100)}%</span>${statusIcon(u,j)}<button type="button" class="pick-assign ${owner>=0?'primary':''}" data-pick="${u.id}" ${!health(u)?'disabled title="生命低于 30%，不能主动出战"':''}>${!health(u)?'生命不足':owner<0?'空闲':state.leaders[owner].name}</button></div>`}).join('')||'没有符合条件的士兵'}</div>`,buttons:'<button class="primary" data-act="close-modal">完成</button>'};render();$('#select-kind').value=selectKind;$('#select-sort').value=selectSort}

function pickCounts(){return state.leaders.map((l,i)=>l.selected?l.name+' '+(selectPicks[i]||[]).length+' 人':'').filter(Boolean).join(' · ')}
function updatePick(id,owner){if(state.guide&&state.guide!=='done')return;let u=state.soldiers.find(x=>x.id===id);if(!u||!health(u))return;if(!state.manualPicks)state.manualPicks=selectPicks.map(ids=>ids.slice());let p=state.manualPicks;selectPicks=p;let existing=ownerOf(id);if(owner>=0&&existing<0&&p.flat().length>=squadLimit)return;for(let list of p){let i=list.indexOf(id);if(i>=0)list.splice(i,1)}if(owner>=0&&state.leaders[owner]?.selected)p[owner].push(id);state.plan=p.map(ids=>types.map((_,k)=>ids.filter(id=>state.soldiers.some(x=>x.id===id&&x.kind===k)).length));let row=document.querySelector(`[data-pick-row="${id}"]`),btn=row?.querySelector('[data-pick]');if(btn){row.classList.toggle('chosen',owner>=0);btn.classList.toggle('primary',owner>=0);btn.textContent=owner<0?'空闲':state.leaders[owner].name}let count=$('#pick-count');if(count)count.textContent=pickCounts();refreshPlanPreview()}
function applyPaintAt(x,y){let btn=document.elementFromPoint(x,y)?.closest('.pick-assign');if(!btn||btn.disabled)return;let id=Number(btn.dataset.pick);if(!paint.seen.has(id)){paint.seen.add(id);updatePick(id,paint.owner)}}
document.addEventListener('change',e=>{if(e.target.id==='select-kind'){selectKind=e.target.value;selectModal()}if(e.target.id==='select-sort'){selectSort=e.target.value;selectModal()}});
document.addEventListener('click',e=>{let target=e.target.closest('[data-pick-action]');if(target){pickAction=Number(target.dataset.pickAction);document.querySelectorAll('[data-pick-action]').forEach(b=>b.classList.toggle('primary',Number(b.dataset.pickAction)===pickAction));return}let btn=e.target.closest('.pick-assign');if(!btn||btn.disabled)return;if(suppressPickClick){suppressPickClick=false;return}let id=Number(btn.dataset.pick);updatePick(id,pickAction)});
document.addEventListener('pointerdown',e=>{let btn=e.target.closest('.pick-assign');if(!btn||btn.disabled||e.button!==0)return;e.preventDefault();let id=Number(btn.dataset.pick),owner=pickAction;paint={owner,seen:new Set(),x:e.clientX,y:e.clientY};suppressPickClick=true;applyPaintAt(e.clientX,e.clientY)});
document.addEventListener('pointermove',e=>{if(!paint)return;let dx=e.clientX-paint.x,dy=e.clientY-paint.y,steps=Math.max(1,Math.ceil(Math.hypot(dx,dy)/10));for(let i=1;i<=steps;i++)applyPaintAt(paint.x+dx*i/steps,paint.y+dy*i/steps);paint.x=e.clientX;paint.y=e.clientY});document.addEventListener('pointerup',()=>{if(paint){paint=null;setTimeout(()=>{suppressPickClick=false},0)}});document.addEventListener('pointercancel',()=>{paint=null;suppressPickClick=false});
document.addEventListener('click',e=>{let button=e.target.closest('[data-quantity]');if(!button)return;let [id,step]=button.dataset.quantity.split(','),input=document.getElementById(id);if(!input)return;let current=Number(input.value),value=Number.isSafeInteger(current)&&current>=1?current:1,isHire=id.startsWith('hire-qty-'),k=isHire?Number(id.slice(9)):-1,max=isHire?Math.min(1000,Math.floor(state.gold/recruitPrices[k])):Math.floor(state.gold/tradePrices[id.slice(4)][0]);if(isHire&&tutorialRemaining()!==null&&k===({sword:0,bow:1,mage_buy:2}[state.guide]))max=Math.min(max,tutorialRemaining());let change=Math.sign(Number(step))*marketStep;input.value=change>0?Math.max(1,Math.min(value+change,Math.max(1,max))):Math.max(1,value+change);input.dispatchEvent(new Event('input',{bubbles:true}))});
document.addEventListener('mouseover',e=>{let b=e.target.closest('[data-act^="hire:"]');if(b){let k=Number(b.dataset.act.split(':')[1]);if(tutorialRemaining()===null||k===({sword:0,bow:1,mage_buy:2}[state.guide]))hirePreviewKind=k;refreshResources()}});
document.addEventListener('input',e=>{if(e.target.matches('[data-plan]'))setPlanInput(e.target,false);if(e.target.id==='sound-volume'){audioVolume=Number(e.target.value)/100;let label=$('#sound-value');if(label)label.textContent=e.target.value+'%'}if(e.target.classList.contains('hire-qty')){hirePreviewKind=Number(e.target.id.slice(9));refreshResources()}if(e.target.classList.contains('hire-qty')||e.target.classList.contains('trade-qty')){refreshMarketButtons();applyGuideLocks()}});document.addEventListener('change',e=>{if(e.target.matches('[data-plan]'))setPlanInput(e.target,true)});
document.addEventListener('click',e=>{let btn=e.target.closest('button');if(btn&&!btn.disabled&&!btn.dataset.act)playSound('button')},true);
document.addEventListener('pointerdown',e=>{let btn=e.target.closest('button:disabled');if(btn&&/^(buy|sell|hire):/.test(btn.dataset.act||''))playSound('error')},true);
document.addEventListener('click',e=>{if(e.target.classList.contains('facility-shade')&&!modal){handle('close-building');return}let a=e.target.closest('[data-act]')?.dataset.act;if(a){let goldBefore=state.gold;handle(a);if(!/^(buy|sell|hire):/.test(a)||state.gold!==goldBefore)playSound(a!=='restart'&&state.gold!==goldBefore?'coin':'button')}});
window.addEventListener('resize',()=>{let old=window.layoutPortrait;fitCanvas();if(state.view==='battle'){if(old!==window.layoutPortrait)render();else fitPortraitBoard()}});document.querySelector('#app').addEventListener('scroll',syncHudHeight);fitCanvas();render();
</script></body></html>
