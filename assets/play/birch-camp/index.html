function slotActors(){return s.companions.map((v,i)=>v?i:null).filter(i=>i!==null).slice(0,3)}
function slotSelected(f){
 const out=[],picks=s.barracksPicks||{},actors=slotActors();
 for(let k=0;k<types.length;k++){
  const pool=eligibleSoldiers(k),byIndex=new Map(pool.map(u=>[u.index,u])),reserve=new Set(Object.keys(picks).filter(key=>key.startsWith(k+',')).map(key=>+key.split(',')[1])),taken=new Set();
  for(let slot=0;slot<3;slot++){
   const count=f[slot]?.[k]||0;
   const chosen=Object.entries(picks).filter(([key,dest])=>dest===slot&&key.startsWith(k+',')).map(([key])=>byIndex.get(+key.split(',')[1])).filter(u=>u&&!taken.has(u.index)).slice(0,count);
   const auto=pool.filter(u=>!taken.has(u.index)&&!reserve.has(u.index)).slice(0,Math.max(0,count-chosen.length));
   for(const u of [...chosen,...auto]){out.push({...u,owner:slot});taken.add(u.index)};
  }
 }
 return out;
}

// ===== Demo 商路系统：保留原型的单兵、岗位及日结状态；不接管 Unity / 战斗系统。 =====
function remoteSoldierKeys(){
  return new Set([...(s.blackRaven?.garrison||[]),...(s.caravanState?.mission?.crew||[])]);
}
function freeLogisticsSoldiers(k){
  // 相同士兵不得同时占据出战编成、营地岗位、异地驻防和运输队。
  const marching=new Set(selectedSoldiers(s.formation).map(u=>u.kind+','+u.index));
  const busy=new Set([...(s.farmAssignments||[]),...(s.facilityWorkers.workshop||[]),...(s.facilityWorkers.caravan||[])]);
  const remote=remoteSoldierKeys();
  return soldierRows(k).filter(u=>u.hp>=30&&!marching.has(k+','+u.index)&&!busy.has(k+','+u.index)&&!remote.has(k+','+u.index));
}
function caravanCapacity(){
  // UI/玩法占位：设施等级决定单趟最多几人，正式以策划配表为准。
  return 2+Math.max(1,s.facilityLevels.caravan||1)*2;
}
function caravanReadiness(){
  const plan=s.caravanState.plan,count=plan.reduce((a,b)=>a+b,0),capacity=caravanCapacity();
  const cargo=count*4,rations=count*4,reasons=[];
  if(!s.raidDone)reasons.push('首次袭击尚未结算');
  if(!s.buildPlaced.some(o=>o.type==='office'))reasons.push('控制中心尚未建成');
  if(!s.buildPlaced.some(o=>o.type==='caravan'))reasons.push('商路中心尚未建成');
  if(!s.blackRaven.captured)reasons.push('尚未攻占黑鸦寨');
  if(s.caravanState.mission)reasons.push('上一趟运输尚未结束');
  if(!count)reasons.push('尚未分配商队成员');
  if(count>capacity)reasons.push('超过设施人数上限');
  if(plan.some((n,k)=>n>freeLogisticsSoldiers(k).length)||s.caravanState.selected?.some(key=>{const [k,i]=key.split(',').map(Number);return !freeLogisticsSoldiers(k).some(u=>u.index===i)}))reasons.push('部分兵种可用人员不足');
  if(s.grain<rations)reasons.push('出发粮食不足：需要 '+rations+'，现有 '+s.grain);
  if(s.blackRaven.captured&&s.blackRaven.stock<cargo)reasons.push('黑鸦寨现存原料不足满载：需要 '+cargo+'，现有 '+s.blackRaven.stock);
  return {plan,count,capacity,cargo,rations,reasons};
}
function logisticsRestAdvance(){
  if(s.blackRaven.captured){
    let gain=s.blackRaven.garrison.length*2;
    s.blackRaven.stock+=gain;
    s.blackRaven.lifetimeProduced+=gain;
  }
  const mission=s.caravanState.mission;
  if(!mission)return;
  let elapsed=s.day-mission.departDay;
  if(elapsed===1){
    if(s.blackRaven.stock<mission.cargo){
      s.caravanState.lastNotice='黑鸦寨原料不足：本次运输停止，人员返回待命；需要重新编成。';
      s.caravanState.lastNoticeDay=s.day;
      s.caravanState.mission=null;
      s.caravanState.plan=[0,0,0];
      refreshAllocation();
    }else{
      s.blackRaven.stock-=mission.cargo;
      mission.phase='returning';
      s.caravanState.lastNotice='商队已抵达黑鸦寨，装载 '+mission.cargo+' 原料，正在回营。';
      s.caravanState.lastNoticeDay=s.day;
    }
  }else if(elapsed>=2){
    s.material+=mission.cargo;
    let record={depart:mission.departDay,arrive:s.day,count:mission.crew.length,cargo:mission.cargo,rations:mission.rations};
    s.caravanState.lastRun=record;
    s.caravanState.history.unshift(record);
    s.caravanState.history=s.caravanState.history.slice(0,6);
    s.caravanState.mission=null;
    s.caravanState.lastNotice='商队安全返营，已卸下 '+mission.cargo+' 原料；今日条件允许即可再次发车。';
    s.caravanState.lastNoticeDay=s.day;
    refreshAllocation();
  }
}

function renderInventoryPanel(person,mode){
 // Exactly one shared markup function for party / shop / warehouse.
 const isParty=mode==='party',isShop=mode==='shop',isWarehouse=mode==='warehouse';
 const isForge=isShop&&s.panel==='smith'&&s.marketTab==='reforge';
 const current=Number.isInteger(person)?person:0,bag=s.party[current]||[];
 const tabAction=isParty?'party-person':isWarehouse?'warehouse-person':'trade-person';
 const tabs=names.map((name,i)=>s.companions[i]?`<button class="inv-person-tab ${i===current?'active':''}" data-act="${tabAction}:${i}" title="${esc(name)}" aria-label="切换至${esc(name)}" aria-pressed="${i===current}"><span class="inv-person-head">${esc(name.slice(0,1))}</span><span class="inv-person-name">${esc(name)}</span></button>`:'').join('');
 const gear=k=>{
  const item=s.equipped[current][k],locked=k===5&&current!==0,ref=`${current},g,${k}`;
  const text=item&&typeof item==='object'?item.name:item||'',sel=isParty&&s.selected?.i===current&&s.selected.kind==='g'&&s.selected.k===k || isWarehouse&&s.warehouseSelection?.source==='gear'&&s.warehouseSelection.person===current&&s.warehouseSelection.index===k;
  const action=isParty?`cell:${ref}`:isWarehouse?`warehouse-gear-select:${k}`:isForge?`trade-select:forge${current}-g-${k}`:`inventory-gear:${current},${k}`;
  return `<button type="button" class="inv-gear-slot ui-gear-slot ${sel?'chosen':''}" data-ref="${ref}" ${locked?'disabled':`data-act="${action}"`} ${text?'draggable="true"':''} title="${esc(slotNames[k]+': '+(locked?'锁定':text||'空位'))}"><small>${esc(slotNames[k])}</small><b>${esc(locked?'锁定':text||'空')}</b></button>`;
 };
 const tiles=Array.from({length:24},(_,k)=>{
  const item=bag[k],name=item&&typeof item==='object'?item.name:item||'',ref=`${current},b,${k}`;
  const tradeKey=isForge?`forge${current}-b-${k}`:`sell${current}-${k}`;
  const selected=isParty&&s.selected?.i===current&&s.selected.kind==='b'&&s.selected.k===k||isWarehouse&&s.warehouseSelection?.source==='bag'&&s.warehouseSelection.person===current&&s.warehouseSelection.index===k||isShop&&s.tradeSelection===tradeKey;
  const act=isParty?`cell:${ref}`:isWarehouse?`warehouse-bag-select:${k}`:`trade-select:${tradeKey}`;
  return `<button type="button" data-bag-slot="${k}" data-ref="${ref}" data-act="${act}" class="inv-bag-slot ui-inventory-cell ${selected?'chosen':''}" ${name?'draggable="true"':''} title="${esc(name||'空位')}">${esc(name.slice(0,4))}${item&&typeof item==='object'&&item.count>1?`<small>×${item.count}</small>`:''}</button>`;
 }).join('');
 return `<article class="inv-panel" data-inventory-mode="${mode}" data-inventory-person="${current}" aria-label="${esc(names[current])}的背包">
  <div class="inv-tabs">${isParty?`<strong class="inv-person-fixed">${esc(names[current])}</strong>`:`<nav class="inv-person-tabs" aria-label="切换随行角色">${tabs}</nav>`}<span class="inv-life">生命 ${s.hp[current]}%<small>兵力 ${captainArmy(current).reduce((a,b)=>a+b,0)}</small></span></div>
  <div class="inv-equipment"><div class="inv-gear-column">${[0,1,2].map(gear).join('')}</div><div class="inv-portrait" aria-label="${esc(names[current])}全身像">${uiAvatar(current)}</div><div class="inv-gear-column">${[3,4,5].map(gear).join('')}</div></div>
  <div class="inv-caption"><b>背包 ${bag.filter(Boolean).length}/24</b><span>${btn('整理','bag-sort:'+current,'inv-inline-button')}${btn('详情','person-detail:'+current,'inv-inline-button')}</span></div>
  <div class="inv-bag-grid">${tiles}</div>
 </article>`;
}

function warehouseItemName(v){return v&&typeof v==='object'?v.name:v||''}
function warehouseCategoryOf(v){const name=warehouseItemName(v),t=itemTypes[name]||{};if(t.slot>=0)return 'equip';if(/矿石|木材|布料/.test(name))return 'material';return 'supply'}
function warehouseDetailMarkup(source,index,person=s.warehousePerson){
 const v=source==='storage'?s.warehouseSlots[index]:source==='gear'?s.equipped[person]?.[index]:s.party[person]?.[index];
 const name=warehouseItemName(v);if(!name)return '';
 const category=warehouseCategoryOf(v),desc=itemTypes[name]?.description||({equip:'装备物品',material:'生产与建造材料',supply:'消耗品及杂物'}[category]);
 const count=v&&typeof v==='object'?v.count:1;
 return `<div class="warehouse-item-detail"><b>${esc(name)}${count>1?' ×'+count:''}</b><span>${esc(desc)}</span>${source==='storage'?btn('取出','warehouse-quick:storage,'+index,'ui-size-sm'):source==='bag'?btn('存入','warehouse-quick:bag,'+index,'ui-size-sm'):''}</div>`;
}
let warehouseLastTap={key:'',time:0};
function warehouseChoose(source,index){
 const key=source+':'+s.warehousePerson+':'+index,now=performance.now();
 if(warehouseLastTap.key===key&&now-warehouseLastTap.time<650){warehouseLastTap={key:'',time:0};if(source==='storage'||source==='bag')warehouseTransfer(source,index);return true}
 warehouseLastTap={key,time:now};s.warehouseSelection={source,index,person:s.warehousePerson};return false;
}
function warehouseTransfer(source,index,dest=null){
 const person=s.warehousePerson,from=source==='storage'?s.warehouseSlots:s.party[person],to=source==='storage'?s.party[person]:s.warehouseSlots;
 let item=from[index];if(!item)return false;const name=warehouseItemName(item);
 if(source==='bag'&&(itemTypes[name]?.bound!==undefined||itemTypes[name]?.quest)){note('绑定或任务物品不能存入仓库');return false}
 let slot=dest!==null?dest:to.findIndex(x=>!x);
 if(slot<0||slot>=to.length||to[slot]){note(source==='storage'?'背包已满':'仓库空间不足');return false}
 to[slot]=item;from[index]=null;s.warehouseSelection=null;render();return true;
}

// shortcut: 网页只排定一场演示袭击，正式排期由游戏工程提供。
const holdRounds=18;
function scheduleRaid(){
 const random=(min,max)=>min+Math.floor(Math.random()*(max-min+1));
 const fighters=random(3,6),archers=random(2,5);
 const event={id:'raid-'+(s.events.length+1),day:s.day+random(3,6),faction:'匪帮',status:'scheduled',
  enemy:[[0,110,15,'首',true],...Array.from({length:fighters},()=>[0,72,13,'战']),...Array.from({length:archers},()=>[1,58,14,'射'])]};
 s.events.push(event);return event;
}
function pendingRaid(){
 const first=s.events.find(e=>e.id==='demo-raid');
 if(first?.status==='scheduled'&&s.raidDone)first.status='repelled';
 const e=s.events.find(e=>e.status==='scheduled')||scheduleRaid();
 if(!e.enemy)e.enemy=encounters.raid.enemy.map(u=>[...u]);
 return e;
}
function raidDue(){return s.day>=pendingRaid().day}
function raidForces(enemy){
 return '队长 '+enemy.filter(u=>u[4]).length+' · 战士 '+enemy.filter(u=>!u[4]&&u[0]===0).length+' · 射手 '+enemy.filter(u=>!u[4]&&u[0]===1).length;
}
function raidGoal(){
 const e=pendingRaid();
 if(raidDue())return '来袭已至 · 去营地西侧迎战';
 if(!s.firstIntel)return '尚未收到首防消息';
 if(s.knownRaids.includes(e.id))return '距来袭 '+(e.day-s.day)+' 天 · 整备守军';
 return '整备下一次防守 · 商人可打听敌情';
}
function battleEnemies(){return s.battleType==='raid'?pendingRaid().enemy:encounters[s.battleType].enemy}
function raidTally(){
 const army=s.battleUnits.filter(u=>u.enemy),down=army.filter(u=>u.health<=0).length;
 const enemies=army.length-down,remaining=Math.max(0,holdRounds-s.round),owed=enemies*remaining;
 const paid=Math.min(owed,Math.max(0,s.coin+30));
 return {down,goal:Math.ceil(army.length/2),enemies,remaining,owed,paid,balance:s.coin-paid};
}
function retreatEstimate(){
 const t=raidTally();
 return '余敌 '+t.enemies+' × 剩余 '+t.remaining+' 回合＝修缮费 '+t.owed+' 金。实扣 '+t.paid+' 金，余额 '+t.balance+' 金（最低 −30）。回收原料 '+t.down+'。';
}
function settleRaid(outcome){
 const e=pendingRaid(),t=raidTally(),won=outcome==='win';
 const reason=won?(t.down>=t.goal?'击退':'坚守'):'失守';
 if(!won)s.coin=t.balance;
 s.material+=t.down;
 e.status=won?'repelled':'breached';s.raidDone=true;
 e.result={enemies:t.enemies,remaining:t.remaining,owed:won?0:t.owed,paid:won?0:t.paid,balance:s.coin,recovered:t.down,reason};
 s.resultData.raid=e.result;scheduleRaid();
}
function scheduledEvents(){return [pendingRaid()]}
function intelReview(kind){return s.intelPurchases[kind]?.day===s.day}
function intelPrice(kind){return kind==='tutorial'||intelReview(kind)?0:kind==='cheap'?10:30}
function eventSnapshot(from,to,source=scheduledEvents()){return source.filter(e=>e.day>=from&&e.day<=to).map(e=>({id:e.id,day:e.day,faction:e.faction,forces:raidForces(e.enemy)}))}
function calendarMark(day){
 const range=s.intelRanges.some(r=>r.days.includes(day));
 const event=s.events.find(e=>e.day===day&&(s.knownRaids.includes(e.id)||e.day<=s.day&&s.firstIntel));
 const label=!event?(range?'风声':''):event.status==='repelled'?'守住':event.status==='breached'?'失守':day===s.day?'来袭':event.id==='demo-raid'?'首袭':'军情';
 return {range,circle:!!event,label,event};
}
function calendarNotes(start){
 const lines=[];
 for(let day=start;day<start+15;day++){
  const {label,event}=calendarMark(day);
  if(event)lines.push('第 '+day+' 天 · '+label+(event.result?' · 损失 '+event.result.paid+' 币':event.scouted?' · '+raidForces(event.enemy):' · 营地西侧'));
 }
 return lines.map(line=>'<div>'+esc(line)+'</div>').join('');
}
function intelSpeech(kind,record){
 if(kind==='cheap')return record.events.length?'这三天有匪帮往营地方向来。':'这三天没听说有匪帮过来。';
 const e=record.events[0];
 if(!e)return '未来五天没有袭击的消息。';
 return kind==='precise'?`第 ${e.day} 天袭营，${e.forces}。`:`黑鸦寨第${e.day}天就到。这几天赶紧备些粮和军需。`;
}
function buyIntel(kind){
 if(kind==='tutorial'?!s.tutorialFree:!s.firstIntel){sayTrade('回营前，先听听老莫的免费消息。');return}
 let record=s.intelPurchases[kind];
 if(!intelReview(kind)){
  const price=intelPrice(kind);
  if(s.coin<price){sayTrade('你的钱不够。');return}
  const events=kind==='tutorial'?eventSnapshot(0,Infinity):eventSnapshot(s.day+1,s.day+(kind==='cheap'?3:5));
  record={day:s.day,events};s.intelPurchases[kind]=record;s.coin-=price;
  if(kind==='cheap'){
   if(events.length)s.intelRanges.push({days:[s.day+1,s.day+2,s.day+3]});
  }else{
   for(const e of events){
    if(!s.knownRaids.includes(e.id))s.knownRaids.push(e.id);
    if(kind==='precise')s.events.find(x=>x.id===e.id).scouted=true;
   }
  }
  if(kind==='tutorial'){
   s.tutorialFree=false;s.firstIntel=true;s.trackedTask='main';s.objectiveCollapsed=false;
  }
 }
 s.marketLine=intelSpeech(kind,record);render();
}

function nextSquare(u,goal,reach,occupied){
 const start=cellKey(u.cx,u.cy),visited=new Set([start]),queue=[[u.cx,u.cy,null]];
 for(let j=0;j<queue.length;j++){
  const [x,y,first]=queue[j];
  if(Math.abs(x-goal.cx)+Math.abs(y-goal.cy)<=reach)return first;
  for(const [dx,dy] of stepDirs){const nx=x+dx,ny=y+dy,k=cellKey(nx,ny);
   if(nx<0||ny<0||nx>=BC||ny>=BR||visited.has(k)||occupied.has(k))continue;
   visited.add(k);queue.push([nx,ny,first||{cx:nx,cy:ny}]);
  }
 }
 return null;
}

function drawSteps(screen){

 for(const [id,path] of motion.steps){
  const el=screen.querySelector('[data-battle-unit="'+id+'"]');

 }
}

 }
 if(!s.battleUnits.some(u=>u.id===s.unit&&u.health>0))s.unit=s.battleUnits.find(u=>!u.enemy&&!u.soldier&&u.health>0)?.id??-1;
 render();showRoundEffects(attacks,hits,document.querySelector('.battle-screen'));
}
function showRoundEffects(attacks,hits,screen){
 const grid=screen?.querySelector('#battlefield-inner');if(!grid||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const unit=id=>grid.querySelector('[data-battle-unit="'+id+'"]');
 const rangedTargets=new Set();
 for(const shot of attacks){
  const target=s.battleUnits.find(u=>u.id===shot.to);
  const path=roundMotion?.steps.get(target.id),arrival=160/walkMs;
  const hitX=path?path.x+(path.toX-path.x)*arrival:target.cx;
  const hitY=path?path.y+(path.toY-path.y)*arrival:target.cy;
  const dx=hitX-shot.x,dy=hitY-shot.y,len=Math.hypot(dx,dy)||1;
  unit(shot.from)?.animate([{translate:'0 0'},{translate:(dx/len*6)+'px '+(dy/len*6)+'px'},{translate:'0 0'}],{duration:185});
  if(!shot.ranged)continue;
  rangedTargets.add(target.id);
  const x=(shot.x+.5)*grid.clientWidth/BC,y=(shot.y+.5)*grid.clientHeight/BR;
  const tx=dx*grid.clientWidth/BC,ty=dy*grid.clientHeight/BR;
  const arrow=document.createElement('i');arrow.className='flow-arrow';arrow.setAttribute('aria-hidden','true');
  arrow.style.left=x+'px';arrow.style.top=y+'px';grid.append(arrow);
  const angle=' rotate('+Math.atan2(ty,tx)+'rad)';
  const flight=arrow.animate([{transform:'translate(0,0)'+angle},{transform:'translate('+tx+'px,'+ty+'px)'+angle}],{duration:160,fill:'forwards'});
  flight.onfinish=()=>arrow.remove();
 }
 for(const id of hits.keys()){
  const target=s.battleUnits.find(u=>u.id===id),el=unit(id)||document.createElement('i');
  if(!el.parentNode){el.className='flow-impact';el.style.left=((target.cx+.5)*100/BC)+'%';el.style.top=((target.cy+.5)*100/BR)+'%';grid.append(el)}
  const flash=el.animate([{filter:'none',backgroundColor:'transparent'},{filter:'drop-shadow(0 0 4px #e44032)',backgroundColor:'#e64b43'},{filter:'none',backgroundColor:'transparent'}],{delay:rangedTargets.has(id)?145:25,duration:155});
  if(el.className==='flow-impact')flash.onfinish=()=>el.remove();
 }
}
function runOrders(){
 if(battleTimer||s.paused||s.panel!=='battle'||!s.combatActive)return;
 battleTimer=setInterval(()=>{if(s.paused||s.panel!=='battle'||!s.combatActive){clearInterval(battleTimer);battleTimer=null;return}roundStep()},roundMs);
}
function endEncounter(outcome){
 if(!s.combatActive)return;
 clearInterval(battleTimer);battleTimer=null;s.combatActive=false;s.paused=true;s.battleDialogue=false;
 s.stats[outcome]++;
 const retry=outcome==='loss'&&s.battleType==='ruins'&&!s.ruinsCleared&&s.retrySnapshot;
 const hurt=[],dead=[];
 for(const u of retry?[]:s.battleUnits.filter(z=>!z.enemy)){
  const pct=Math.max(1,Math.ceil(u.health*100/u.max));
  if(!u.soldier){s.hp[u.id]=pct;continue}
  const label=types[u.kind]+' #'+(u.index+1);
  if(!u.health&&Math.random()<.4){dead.push(label);removeTrooper(u.kind,u.index)}
  else{s.soldiers[u.kind][u.index]=pct;if(pct<100)hurt.push(label+' '+pct+'%')}
 }
 if(retry)Object.assign(s,retry);s.retrySnapshot=null;s.stats.dead+=dead.length;
 s.resultKind=outcome;
 const first=s.battleType==='ruins'?!s.ruinsCleared:s.battleType==='bandits'?!s.banditsWon:true;
 s.rewardChoice=[false,false,true,true];s.resultData={first,hurt,dead,work:retry?null:s.battleWork,retried:!!retry,used:retry?0:s.prepSupplySpent,claimed:false,enemyDown:s.battleUnits.filter(z=>z.enemy&&z.health<=0).length};
 s.battleWork=null;
 if(outcome==='win'){if(s.battleType==='ruins'&&first){s.ruinsCleared=true;s.mainStage=2;s.galanFate='waiting';showStory('rescue');return}
 else if(s.battleType==='raven'){s.finished=true;open('finale');return}
 else if(s.battleType==='bandits')s.banditsWon=true}
 if(s.battleType==='raid')settleRaid(outcome);
 open('result');
}
function resultBody(){
 const r=s.resultData;if(!r)return '';
 const enc=encounters[s.battleType],cost=rewardCost();
 return '<div class="card">'+(r.retried?row('重新整备','队长生命与军需已恢复至本次备战前'): '')+row('战斗回合',s.round)+row('军需实耗',r.used+' 件')+row('敌方失能',r.enemyDown+' 人')+(r.work&&(r.work.farm||r.work.workshop)?row('按出战时岗位 · 今日减产',workCostText(r.work)):'')+
 (r.raid?row('防守 · '+(r.raid.reason||'战果'),'回收原料 +'+(r.raid.recovered||0)):'')+(r.raid&&s.resultKind!=='win'?row('设施修缮',r.raid.enemies+' 名余敌 × '+r.raid.remaining+' 回合 = '+r.raid.owed+' 币 · 实扣 '+r.raid.paid+' · 余额 '+(r.raid.balance??s.coin)):'')+row('负伤归队',r.hurt.join('、')||'无')+row('阵亡',r.dead.join('、')||'无')+'</div>'+
 (s.resultKind==='win'?'<div class="card">'+row('战果','原料 +'+enc.ore+' · 金钱 +'+enc.coin)+row('领取体力',cost+' / '+s.stamina)+'</div>':'');
}
function finaleView(){
 const t=s.stats,raids=s.events;
 return '<div class="shade"><section class="panel" role="dialog"><div class="panel-head"><h2>第 '+s.day+' 天攻下黑鸦寨</h2><span>'+esc(s.difficulty)+' · 试玩结束</span></div><div class="card">'+row('战斗 '+t.started+' 场','胜 '+t.win+' · 败 '+t.loss+' · 撤退 '+t.retreat)+row('营地防守','守住 '+raids.filter(e=>e.status==='repelled').length+' · 失守 '+raids.filter(e=>e.status==='breached').length)+row('守胜方式','击退 '+raids.filter(e=>e.result?.reason==='击退').length+' · 坚守 '+raids.filter(e=>e.result?.reason==='坚守').length)+row('普通兵','招募 '+t.hired+' · 阵亡 '+t.dead)+row('营地自产','粮食 '+t.food+' · 一级军需 '+t.low+' · 二级军需 '+t.high)+row('战后营地','金币 '+s.coin+' · 战士 '+s.troops[0]+' · 射手 '+s.troops[1])+'</div>'+btn('返回主菜单','finale-menu','primary')+'</section></div>';
}
function rewardCost(){return s.resultData.first||s.battleType==='raid'?0:20}
function claimResult(){
 const r=s.resultData;if(!r||r.claimed||s.resultKind!=='win')return;
 const cost=rewardCost();if(s.stamina<cost){note('领取需要 '+cost+' 体力');return}
 r.claimed=true;s.stamina-=cost;const enc=encounters[s.battleType];s.coin+=enc.coin;s.material+=enc.ore;
 s.panel=null;render();

const flowSlot='demoflow.campaign.2';
const previewPages=new Set(['party','local-trade','warehouse','logistics','office','strategy','caravan','base-build','placement','smith','loot','upgrade','facility-upgrade','reforge','character-stats','ui-kit','equipment','manager-select']);
let liveCampaign=null;
function previewScope(){
 if(previewPages.has(s.panel)||(s.panel==='quests'&&s.sub==='achievement')){
  if(!liveCampaign){liveCampaign=s;s=structuredClone(s)}
 }else if(liveCampaign){
  const {panel,sub,scene,npcShop,marketTab}=s;s=liveCampaign;liveCampaign=null;Object.assign(s,{panel,sub,scene,npcShop,marketTab});
 }
}
function persist(){
 const state=liveCampaign||s;if(state.scene==='menu')return;
 try{localStorage.setItem(flowSlot,JSON.stringify({...state,panel:state.combatActive?'battle':['story','result','finale','captain-choice','merchant-guide'].includes(state.panel)?state.panel:null,pop:null,paused:true,orders:state.orders}))}catch{}
}

 s.battleType='ruins';

  wake1:['旁白','白桦村遭到异族袭击。搭档留下断后，自此下落不明。',next('wake2')],

  wake3:['旁白','醒来时，你已在灰岩镇外的营地。乡亲们还得在这里吃饭、过夜。先去镇上见领主，给大家找个落脚的办法。',[['前往营地','exit']]],

  lord2:[lord,'哨探也没摸清他们的底细。',[['我想在营地修工坊、招些人手。请您给道许可。','commission']]],
  commission:[lord,'你想修工坊、招兵？先帮我办件事。镇东的沉眠古窟近日在冒黑雾，两个采石的镇民还没回来。听说你扛得住瘴气。进窟查查，他们要是还活着，就带回来。',[['接受沉眠古窟调查','accept'],['有什么奖励吗？','reward'],['暂且告辞','exit']]],
  reward:[lord,'事办妥，赏金和建设许可归你，募兵处也会放行。',[['接受沉眠古窟调查','accept'],['暂且告辞','exit']]],
  investigate:[lord,'古窟走东口。若嫌人手少，可以去铁匠铺问问。',bye],
  report:[lord,'古窟那两个人，有消息了？',[['爵士，两个镇民都救出来了，控制他们的古裔也已制住。','deliver']]],
  earlyReport:[lord,'我正要派人查古窟。你也是为这事来的？',[['两个采石的镇民已经脱险，困住他们的古裔也制住了。','deliver']]],
  deliver:[lord,s.acceptedQuest?'原来窟里有古裔。往后得让哨探多留意。这是答应你的赏金和许可。工坊、兵营都准修。':'这份赏金和建设许可，你拿去。募兵处我会打招呼。',[['领赏，接下手令','permit']]],
  licensed:[lord,'带手令去募兵处找雷恩。',bye],needPermit:['雷恩','外乡人？没爵士的手令，我一个兵也不能给你。',[['先去拜访领主','exit']]],
  challenge:[who,'何人聒噪，吾乃古裔精锐迦兰是也，外来者速速退去，此地不是尔等所能沾染的。',[['继续推进','warn'],['先退出去准备一下','exit']]],

  rescue2:['获救百姓乙','我们这就回灰岩镇。见了霍恩爵士，会把经过说清楚。',[['出洞，听迦兰解释','galan']]],
  galan:[who,g.opening,[[g['choice.control'],'admission'],[g['choice.ruins'],'lore'],[g['choice.village'],'village'],[g['choice.execute'],'execute'],[g['choice.wait'],'exit']]],
  lore:[who,g.ruins,next('galan')],village:[who,g.village,next('galan')],
  admission:[who,g.admission,[[g['choice.attack'],'pledge'],[g['choice.trust'],'pledge'],[g['choice.more'],'galan']]],

  later:[who,g.later,bye],slain:[who,g.executed,next('exit')],recruited:[who,g.recruited,next('assignGalan')]
 };
 const [name,line,choices]=scenes[s.storyNode];
 return dialogueView(name,line,choices.map(([label,to],i)=>btn(label,'story:'+to,i===0?'primary':'')).join(''),['challenge','warn'].includes(s.storyNode));

function storyAction(to){
 if(to==='exit'){s.panel=null;render();return}
 if(to==='accept'){action('lord-accept');return}

function bootFlow(){
 const existing=localStorage.getItem(flowSlot);if(!existing)return false;
 try{s=JSON.parse(existing);s.paused=true;s.scene='camp';if(s.tutorialArmed&&!s.tutorialSeen){offerIntel();return true}render();return true}catch{return false}
}
function keyOf(u){return u.kind+','+u.index}
function removeTrooper(k,i){
 const key=k+','+i;if(s.soldiers[k][i]==null)return;
 s.soldiers[k][i]=null;s.troops[k]--;delete s.spent[key];
 s.farmAssignments=s.farmAssignments.filter(v=>v!==key);
 s.facilityWorkers.workshop=s.facilityWorkers.workshop.filter(v=>v!==key);
 delete s.formationPicks[key];delete s.barracksPicks[key];s.workers=s.farmAssignments.length;s.supplyWorkers=s.facilityWorkers.workshop.length;
 s.slotFormation=null;s.formation=fitFormation(s.formation);
}
function soldierRows(k){return (s.soldiers[k]||[]).flatMap((hp,index)=>hp==null?[]:[{kind:k,index,hp}])}
const grainPerWorker=3;
function daily(excluded=[]){
 const absent=new Set(excluded.map(keyOf));
 const can=key=>{const [k,i]=key.split(',');return s.soldiers[k]?.[i]>=30&&s.spent[key]!==s.day&&!absent.has(key)};
 const farm=s.farmAssignments.filter(can).length,workshop=s.facilityWorkers.workshop.filter(can).length;
 const cost=s.workTier===2?4:2,supply=Math.min(workshop*2,Math.floor(s.material/cost)),mouth=s.troops.reduce((a,b)=>a+b,0);
 const harvest=farm*grainPerWorker;
 return {farm,workshop,supply,mouth,harvest,food:harvest-mouth,material:-cost*supply,stamina:Math.min(s.staminaRecovery,s.staminaMax-s.stamina)};
}
function deploymentWork(selected){
 const home=daily(),away=daily(selected);
 return {home,away,farm:home.farm-away.farm,workshop:home.workshop-away.workshop,
  grain:home.harvest-away.harvest,supply:home.supply-away.supply};
}
function workCostText(work){
 return '少收粮 '+work.grain+' · 少制军需 '+work.supply;
}
function restDay(){
 if(!s.firstIntel){note('首日须先领取老莫的免费消息。'+campaignTask()[1]);return}
 if(raidDue()){note('先处理营地外围的袭击');return}
 advanceDay();open(raidDue()?'raid-notice':'report');
}
function advanceDay(away=[]){
 const d=daily(away),short=Math.max(0,-(s.grain+d.food)),leavers=[];
 s.lastDailyFood=d.food;s.grain=Math.max(0,s.grain+d.food);s.material+=d.material;s[s.workTier===2?'supply2':'supplies']+=d.supply;s.stats.food+=d.harvest;s.stats[s.workTier===2?'high':'low']+=d.supply;
 for(let n=0;n<short;n++){let all=facilityListAll();if(!all.length)break;let u=all[Math.floor(Math.random()*all.length)];leavers.push(types[u.kind]+' #'+(u.index+1));removeTrooper(u.kind,u.index)}
 s.day++;s.stamina+=d.stamina;s.stock=[3,3];s.spent={};s.hp=s.hp.map(v=>Math.min(100,v+40));
 s.soldiers=s.soldiers.map(list=>list.map(v=>v==null?null:Math.min(100,v+35)));
 s.report='产粮 '+d.harvest+'，口粮 '+d.mouth+'；消耗原料 '+(-d.material)+'，产出'+tierName(s.workTier)+'军需 '+d.supply+'。'+(leavers.length?'缺粮离队：'+leavers.join('、')+'。':'');
}
const basicGoods=[['粮食','grain',3,2],['原料','material',3,2],['军需','supplies',6,4]];
function resourceEntries(){
 const selling=s.marketTab==='sell',mode=selling?'sell':'buy',verb=selling?'卖出':'买入';
 return basicGoods.flatMap(([label,key,buy,sell],i)=>{
  if(selling&&s[key]<=0)return [];
  const price=selling?sell:buy;
  return [{key:'res'+i,label,price,description:'持有 '+s[key]+' · '+verb+'单价 '+price+' 币',
   control:quantity('res'+i,price)+btn(verb,'resource:'+mode+':'+i)}];
 });
}
function tradeResource(mode,i){
 const def=basicGoods[i];if(!def||mode!==s.marketTab||!['buy','sell'].includes(mode)||s.panel!=='market')return;
 const [,key,buy,sell]=def,n=tradeCount('res'+i);
 if(!Number.isSafeInteger(n)||n<=0)return;
 if(mode==='buy'&&s.coin>=n*buy){s.coin-=n*buy;s[key]+=n}
 else if(mode==='sell'&&s[key]>=n){s.coin+=n*sell;s[key]-=n}
 else {sayTrade('库存或金钱不足。');return}render()
}
function formationSummary(f){const picked=selectedSoldiers(f),base=daily(),away=daily(picked);return {
 remaining:types.map((_,k)=>eligibleSoldiers(k).length-picked.filter(u=>u.kind===k).length),
 farm:base.farm-away.farm,workshop:base.workshop-away.workshop}}

// Update only the dependent panes while a target count is being typed.
document.addEventListener('input',e=>{
 if(s.panel!=='prep'||!e.target.matches('[data-prep-count]'))return;
 document.querySelectorAll('.prep-card').forEach(card=>{
  const b=card.querySelector('button'),chosen=b.dataset.act==='prep-captain:'+s.prepCaptain;

 for(const selector of ['.prep-comparison','.prep-actions','.roster-board','.flow-budget','.prep-work-cost','.facility-list-title']){
  const old=shell?.querySelector(selector),replacement=next.querySelector(selector);
  if(old&&replacement){const scroll=old.querySelector('.roster-lines')?.scrollTop||0;old.replaceWith(replacement);const list=replacement.querySelector('.roster-lines');if(list)list.scrollTop=scroll;}
 }
});
